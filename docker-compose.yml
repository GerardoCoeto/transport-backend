services:

  postgres-orders:
    image: postgres:latest
    container_name: postgres-orders
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5433:5432"
    networks:
      - transport-net

  postgres-drivers:
    image: postgres:latest
    container_name: postgres-drivers
    environment:
      POSTGRES_DB: drivers_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5434:5432"
    networks:
      - transport-net

  postgres-assignments:
    image: postgres:latest
    container_name: postgres-assignments
    environment:
      POSTGRES_DB: assignments_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5435:5432"
    networks:
      - transport-net

  postgres-auth:
    image: postgres:latest
    container_name: postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5436:5432"
    networks:
      - transport-net


  eureka-server:
    build: ./EurekaServer
    container_name: eureka-server
    ports:
      - "9000:9000"
    networks:
      - transport-net


  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "9001:9001"
    depends_on:
      - postgres-orders
      - eureka-server
    networks:
      - transport-net


  driver-service:
    build: ./driver-service
    container_name: driver-service
    ports:
      - "9002:9002"
    depends_on:
      - postgres-drivers
      - eureka-server
    networks:
      - transport-net


  assignment-service:
    build: ./assignment-service
    container_name: assignment-service
    ports:
      - "9003:9003"
    depends_on:
      - postgres-assignments
      - eureka-server
      - order-service
      - driver-service
    networks:
      - transport-net


  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "9005:9005"
    depends_on:
      - postgres-auth
      - eureka-server
    networks:
      - transport-net


networks:
  transport-net:
    driver: bridge